<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Health Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; min-height: 100vh; padding: 30px; font-family: Arial, sans-serif; }
        .btn-add { background: #3b82f6; color: white; padding: 12px 30px; border-radius: 10px; text-decoration: none; display: inline-block; }
        .btn-add:hover { background: #2563eb; color: white; }
        .company-row { background: #1e293b; padding: 18px 20px; border-radius: 12px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .company-row h5 { margin: 0; }
        .btn-sm { padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; margin-left: 6px; }
        .btn-success { background: #10b981; color: white; }
        .btn-info { background: #06b6d4; color: white; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 900px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1>📊 Financial Analyzer</h1>
            <a href="/add-company" class="btn-add">+ Add Company</a>
        </div>
        {% if companies %}
            {% for company in companies %}
            <div class="company-row">
                <div>
                    <h5>{{ company.name }}</h5>
                    <small style="color: #94a3b8;">{{ company.ticker }} | {{ company.sector }}</small>
                </div>
                <div>
                    <a href="/input-data/{{ company._id }}" class="btn-sm btn-success">📝 Input Data</a>
                    <a href="/analysis/{{ company._id }}" class="btn-sm btn-info">📊 View Analysis</a>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div style="text-align: center; padding: 60px; background: #1e293b; border-radius: 15px;">
                <h4>No companies added yet</h4>
                <p style="color: #94a3b8;">Click "Add Company" to get started</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
