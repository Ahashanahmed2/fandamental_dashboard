<!DOCTYPE html>
<html>
<head>
    <title>Add Company</title>
</head>
<body style="background:#0f172a;color:white;padding:40px;">
    <h1>➕ Add Company</h1>
    <form id="f"><input id="n" placeholder="Name" required><input id="t" placeholder="Ticker" required><select id="s"><option value="Bank">Bank</option><option value="General">General</option></select><button type="submit">Save</button></form>
    <script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();let r=await fetch('/api/companies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('n').value,ticker:document.getElementById('t').value,sector:document.getElementById('s').value})});if(r.ok)window.location.href='/';})</script>
</body>
</html>
