<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; color: white; min-height: 100vh; font-family: Arial, sans-serif; }
        .form-card { background: #1e293b; padding: 30px; border-radius: 15px; max-width: 550px; margin: 60px auto; }
        .form-control, .form-select { background: #334155; color: white; border: 1px solid #475569; padding: 10px; border-radius: 8px; width: 100%; margin-top: 6px; }
        .form-control:focus { background: #334155; color: white; outline: none; }
        label { font-weight: bold; margin-top: 12px; display: block; }
        .btn-submit { background: #3b82f6; color: white; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .btn-cancel { background: #64748b; color: white; padding: 12px 20px; border-radius: 8px; text-decoration: none; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h3 style="margin-bottom: 20px;">➕ Add New Company</h3>
            <form id="companyForm">
                <label>Company Name *</label>
                <input type="text" class="form-control" id="name" required placeholder="e.g., Square Pharmaceuticals">
                
                <label>Ticker Symbol *</label>
                <input type="text" class="form-control" id="ticker" required placeholder="e.g., SQURPHARMA">
                
                <label>Sector *</label>
                <select class="form-select" id="sector" required>
                    <option value="">Select Sector</option>
                    <option value="Bank">🏦 Bank</option>
                    <option value="Pharmaceuticals">💊 Pharmaceuticals</option>
                    <option value="Textile">👕 Textile</option>
                    <option value="Telecom">📱 Telecom</option>
                    <option value="Food">🍔 Food</option>
                    <option value="Energy">⚡ Energy</option>
                    <option value="Cement">🏗️ Cement</option>
                    <option value="General">📦 General</option>
                </select>
                
                <label>Sub Sector (Optional)</label>
                <input type="text" class="form-control" id="subSector" placeholder="e.g., Generic Pharma">
                
                <button type="submit" class="btn-submit">💾 Save Company</button>
                <a href="/" class="btn-cancel">Cancel</a>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('companyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                ticker: document.getElementById('ticker').value.toUpperCase(),
                sector: document.getElementById('sector').value,
                sub_sector: document.getElementById('subSector').value || null,
            };
            const res = await fetch('/api/companies', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert('✅ Company added successfully!');
                window.location.href = '/';
            } else {
                const error = await res.json();
                alert('❌ ' + (error.detail || 'Error'));
            }
        });
    </script>
</body>
</html>
